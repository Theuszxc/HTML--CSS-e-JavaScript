<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Categorias</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .modal {
            transition: all 0.3s ease;
        }
        .loading {
            display: none;
        }
        .error-message {
            display: none;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">
                <i class="fas fa-tags text-indigo-600 mr-2"></i>
                Gerenciador de Categorias
            </h1>
            <p class="text-gray-600">Gerencie suas categorias de forma simples e eficiente</p>
        </div>

        <!-- Formulário para adicionar nova categoria -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-8">
            <h2 class="text-2xl font-semibold text-gray-800 mb-4">
                <i class="fas fa-plus-circle text-green-600 mr-2"></i>
                Adicionar Nova Categoria
            </h2>
            <form id="categoryForm" class="space-y-4">
                <div>
                    <label for="categoryName" class="block text-sm font-medium text-gray-700 mb-2">
                        Nome da Categoria *
                    </label>
                    <input type="text" 
                           id="categoryName" 
                           name="name" 
                           required
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
                           placeholder="Digite o nome da categoria">
                </div>
                <div>
                    <label for="categoryDescription" class="block text-sm font-medium text-gray-700 mb-2">
                        Descrição
                    </label>
                    <textarea id="categoryDescription" 
                              name="description" 
                              rows="3"
                              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
                              placeholder="Digite uma descrição para a categoria (opcional)"></textarea>
                </div>
                <button type="submit" 
                        class="w-full bg-gradient-to-r from-green-500 to-green-600 text-white font-semibold py-2 px-4 rounded-lg hover:from-green-600 hover:to-green-700 transition transform hover:scale-105">
                    <i class="fas fa-save mr-2"></i>
                    Salvar Categoria
                </button>
            </form>
        </div>

        <!-- Lista de categorias -->
        <div class="bg-white rounded-lg shadow-lg p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-semibold text-gray-800">
                    <i class="fas fa-list text-indigo-600 mr-2"></i>
                    Lista de Categorias
                </h2>
                <div class="flex space-x-2">
                    <button onclick="loadCategories()" 
                            class="bg-indigo-500 text-white px-4 py-2 rounded-lg hover:bg-indigo-600 transition">
                        <i class="fas fa-sync-alt mr-2"></i>
                        Atualizar
                    </button>
                </div>
            </div>
            
            <!-- Loading indicator -->
            <div id="loading" class="loading text-center py-8">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div>
                <p class="text-gray-600 mt-2">Carregando categorias...</p>
            </div>
            
            <!-- Error message -->
            <div id="errorMessage" class="error-message bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
                <strong><i class="fas fa-exclamation-triangle mr-2"></i>Erro!</strong>
                <span id="errorText"></span>
            </div>
            
            <!-- Categories list -->
            <div id="categoriesList" class="space-y-3">
                <!-- Categories will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Modal para edição -->
    <div id="editModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md mx-4">
            <div class="border-b px-6 py-4">
                <h3 class="text-xl font-semibold text-gray-800">
                    <i class="fas fa-edit text-blue-600 mr-2"></i>
                    Editar Categoria
                </h3>
            </div>
            <div class="p-6">
                <form id="editForm">
                    <input type="hidden" id="editCategoryId">
                    <div class="mb-4">
                        <label for="editCategoryName" class="block text-sm font-medium text-gray-700 mb-2">
                            Nome da Categoria *
                        </label>
                        <input type="text" 
                               id="editCategoryName" 
                               required
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                    <div class="mb-4">
                        <label for="editCategoryDescription" class="block text-sm font-medium text-gray-700 mb-2">
                            Descrição
                        </label>
                        <textarea id="editCategoryDescription" 
                                  rows="3"
                                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"></textarea>
                    </div>
                    <div class="flex justify-end space-x-3">
                        <button type="button" 
                                onclick="closeEditModal()"
                                class="px-4 py-2 bg-gray-300 text-gray-700 rounded-lg hover:bg-gray-400 transition">
                            Cancelar
                        </button>
                        <button type="submit" 
                                class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition">
                            <i class="fas fa-save mr-2"></i>
                            Atualizar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Configuração da API
        const API_BASE_URL = 'http://localhost:8080/api/categorias'; // Ajuste a URL conforme sua configuração

        // Carregar categorias ao iniciar a página
        document.addEventListener('DOMContentLoaded', () => {
            loadCategories();
            
            // Adicionar evento de submit para o formulário de criação
            document.getElementById('categoryForm').addEventListener('submit', createCategory);
            
            // Adicionar evento de submit para o formulário de edição
            document.getElementById('editForm').addEventListener('submit', updateCategory);
        });

        // Função para carregar todas as categorias
        async function loadCategories() {
            showLoading(true);
            hideError();
            
            try {
                const response = await fetch(`${API_BASE_URL}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`Erro HTTP: ${response.status}`);
                }
                
                const categories = await response.json();
                displayCategories(categories);
            } catch (error) {
                console.error('Erro ao carregar categorias:', error);
                showError('Não foi possível carregar as categorias. Verifique se o backend está rodando.');
            } finally {
                showLoading(false);
            }
        }

        // Função para exibir categorias na tela
        function displayCategories(categories) {
            const categoriesList = document.getElementById('categoriesList');
            
            if (!categories || categories.length === 0) {
                categoriesList.innerHTML = `
                    <div class="text-center py-8 text-gray-500">
                        <i class="fas fa-folder-open text-4xl mb-2"></i>
                        <p>Nenhuma categoria encontrada.</p>
                        <p class="text-sm">Adicione sua primeira categoria usando o formulário acima!</p>
                    </div>
                `;
                return;
            }
            
            categoriesList.innerHTML = categories.map(category => `
                <div class="bg-gray-50 rounded-lg p-4 hover:shadow-md transition border border-gray-200">
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <h3 class="text-lg font-semibold text-gray-800">${escapeHtml(category.name)}</h3>
                            ${category.description ? `<p class="text-gray-600 mt-1">${escapeHtml(category.description)}</p>` : '<p class="text-gray-400 italic mt-1">Sem descrição</p>'}
                            <p class="text-xs text-gray-400 mt-2">ID: ${category.id}</p>
                        </div>
                        <div class="flex space-x-2">
                            <button onclick="editCategory(${category.id})" 
                                    class="bg-blue-500 text-white px-3 py-1 rounded hover:bg-blue-600 transition">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button onclick="deleteCategory(${category.id})" 
                                    class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600 transition">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Função para criar nova categoria
        async function createCategory(event) {
            event.preventDefault();
            
            const name = document.getElementById('categoryName').value.trim();
            const description = document.getElementById('categoryDescription').value.trim();
            
            if (!name) {
                showError('Por favor, informe o nome da categoria.');
                return;
            }
            
            const categoryData = {
                name: name,
                description: description || null
            };
            
            showLoading(true);
            hideError();
            
            try {
                const response = await fetch(`${API_BASE_URL}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(categoryData)
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || `Erro HTTP: ${response.status}`);
                }
                
                // Limpar formulário
                document.getElementById('categoryForm').reset();
                
                // Recarregar lista
                await loadCategories();
                
                // Mostrar mensagem de sucesso
                showTemporaryMessage('Categoria criada com sucesso!', 'success');
                
            } catch (error) {
                console.error('Erro ao criar categoria:', error);
                showError(error.message || 'Erro ao criar categoria. Verifique os dados e tente novamente.');
            } finally {
                showLoading(false);
            }
        }

        // Função para editar categoria (abrir modal)
        async function editCategory(id) {
            showLoading(true);
            hideError();
            
            try {
                const response = await fetch(`${API_BASE_URL}/${id}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`Erro HTTP: ${response.status}`);
                }
                
                const category = await response.json();
                
                // Preencher modal com dados da categoria
                document.getElementById('editCategoryId').value = category.id;
                document.getElementById('editCategoryName').value = category.name;
                document.getElementById('editCategoryDescription').value = category.description || '';
                
                // Abrir modal
                document.getElementById('editModal').classList.remove('hidden');
                document.getElementById('editModal').classList.add('flex');
                
            } catch (error) {
                console.error('Erro ao carregar categoria para edição:', error);
                showError('Não foi possível carregar os dados da categoria.');
            } finally {
                showLoading(false);
            }
        }

        // Função para atualizar categoria
        async function updateCategory(event) {
            event.preventDefault();
            
            const id = document.getElementById('editCategoryId').value;
            const name = document.getElementById('editCategoryName').value.trim();
            const description = document.getElementById('editCategoryDescription').value.trim();
            
            if (!name) {
                showError('Por favor, informe o nome da categoria.');
                return;
            }
            
            const categoryData = {
                id: parseInt(id),
                name: name,
                description: description || null
            };
            
            showLoading(true);
            hideError();
            
            try {
                const response = await fetch(`${API_BASE_URL}/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(categoryData)
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || `Erro HTTP: ${response.status}`);
                }
                
                // Fechar modal
                closeEditModal();
                
                // Recarregar lista
                await loadCategories();
                
                // Mostrar mensagem de sucesso
                showTemporaryMessage('Categoria atualizada com sucesso!', 'success');
                
            } catch (error) {
                console.error('Erro ao atualizar categoria:', error);
                showError(error.message || 'Erro ao atualizar categoria. Verifique os dados e tente novamente.');
            } finally {
                showLoading(false);
            }
        }

        // Função para excluir categoria
        async function deleteCategory(id) {
            if (!confirm('Tem certeza que deseja excluir esta categoria? Esta ação não pode ser desfeita.')) {
                return;
            }
            
            showLoading(true);
            hideError();
            
            try {
                const response = await fetch(`${API_BASE_URL}/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || `Erro HTTP: ${response.status}`);
                }
                
                // Recarregar lista
                await loadCategories();
                
                // Mostrar mensagem de sucesso
                showTemporaryMessage('Categoria excluída com sucesso!', 'success');
                
            } catch (error) {
                console.error('Erro ao excluir categoria:', error);
                showError(error.message || 'Erro ao excluir categoria. Verifique se a categoria existe.');
            } finally {
                showLoading(false);
            }
        }

        // Funções auxiliares
        function showLoading(show) {
            const loadingElement = document.getElementById('loading');
            if (show) {
                loadingElement.style.display = 'block';
            } else {
                loadingElement.style.display = 'none';
            }
        }
        
        function showError(message) {
            const errorElement = document.getElementById('errorMessage');
            const errorTextElement = document.getElementById('errorText');
            errorTextElement.textContent = message;
            errorElement.style.display = 'block';
            
            // Auto-hide após 5 segundos
            setTimeout(() => {
                hideError();
            }, 5000);
        }
        
        function hideError() {
            document.getElementById('errorMessage').style.display = 'none';
        }
        
        function showTemporaryMessage(message, type) {
            // Criar elemento de mensagem temporária
            const messageDiv = document.createElement('div');
            messageDiv.className = `fixed top-4 right-4 ${type === 'success' ? 'bg-green-500' : 'bg-red-500'} text-white px-6 py-3 rounded-lg shadow-lg z-50`;
            messageDiv.innerHTML = `
                <i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'} mr-2"></i>
                ${message}
            `;
            
            document.body.appendChild(messageDiv);
            
            // Remover após 3 segundos
            setTimeout(() => {
                messageDiv.remove();
            }, 3000);
        }
        
        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
            document.getElementById('editModal').classList.remove('flex');
            document.getElementById('editForm').reset();
        }
        
        // Função para escapar HTML e prevenir XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Fechar modal ao clicar fora
        window.onclick = function(event) {
            const modal = document.getElementById('editModal');
            if (event.target === modal) {
                closeEditModal();
            }
        }
    </script>
</body>
</html>
